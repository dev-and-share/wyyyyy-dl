name: Release and Publish Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag_info.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js (Svelte 5 frontend)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Svelte 5 frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build JAR with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar -x test --no-daemon
          ls -la build/libs/

      - name: Extract Tag Name
        id: tag_info
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "refs/heads/main" ]; then
            PKG_VERSION=$(node -p "require('./frontend/package.json').version")
            TAG_NAME="v${PKG_VERSION}"
          fi
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Upload JAR
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Release ${{ steps.tag_info.outputs.tag }}"
          files: build/libs/wyyyyy-dl-*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Meta (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and Push Multi-Arch Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-native:
    name: Build Native (${{ matrix.arch }})
    needs: [build-and-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.native
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=native-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=native-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Extract native binary from Docker image
        run: |
          docker create --name temp-native-container ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          docker cp temp-native-container:/app/wyyyyy-dl ./wyyyyy-dl-linux-${{ matrix.arch }}
          docker rm temp-native-container
          chmod +x ./wyyyyy-dl-linux-${{ matrix.arch }}
          ls -lh ./wyyyyy-dl-linux-${{ matrix.arch }}

      - name: Upload native binary to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ./wyyyyy-dl-linux-${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  merge-native:
    name: Merge and Publish Multi-Arch Native Image
    runs-on: ubuntu-latest
    needs: [build-and-release, build-native]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push multi-arch manifest
        run: |
          cd /tmp/digests
          TAG_NAME="${{ needs.build-and-release.outputs.tag }}"
          CLEAN_VERSION="${TAG_NAME#v}"
          TAGS=()
          TAGS+=("-t" "ghcr.io/${{ github.repository }}:${TAG_NAME}-native")
          TAGS+=("-t" "ghcr.io/${{ github.repository }}:${CLEAN_VERSION}-native")
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAGS+=("-t" "ghcr.io/${{ github.repository }}:latest-native")
          fi

          DIGEST_ARGS=()
          for d in *; do
            DIGEST_ARGS+=("ghcr.io/${{ github.repository }}@sha256:$d")
          done

          echo "Publishing tags: ${TAGS[*]}"
          echo "With manifests: ${DIGEST_ARGS[*]}"
          docker buildx imagetools create "${TAGS[@]}" "${DIGEST_ARGS[@]}"

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ needs.build-and-release.outputs.tag }}-native
