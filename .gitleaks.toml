# Gitleaks Configuration
# https://github.com/gitleaks/gitleaks#configuration
# 本配置在默认规则基础上，针对本项目定制了白名单

title = "wyyyyy-dl gitleaks config"

[extend]
# 继承 gitleaks 内置默认规则集（涵盖 AWS / GitHub Token / 高熵字符串等 50+ 条规则）
useDefault = true

# ==== 项目级白名单 ====
[allowlist]
description = "Allow project-specific safe patterns"

# 忽略的文件路径（前端 lock 文件、测试夹具、示例配置等）
paths = [
  '''frontend/package-lock\.json''',
  '''frontend/node_modules/.*''',
  '''gradle/.*''',
  '''\.gradle/.*''',
  '''build/.*''',
  '''pics/.*''',
]

# 忽略特定已知安全的字符串（如示例 cookie、文档占位符）
regexes = [
  # .env.example 中的占位符
  '''your-cookie-here''',
  '''<YOUR_.*_HERE>''',
  # 前端 Tailwind / CSS 颜色哈希（形如 #ef4444）
  '''#[0-9a-fA-F]{6}''',
  # 网易云 WEAPI 协议固定 nonce（公开逆向文档中的协议常量，非真实密钥）
  # 参考: https://github.com/Binaryify/NeteaseCloudMusicApi
  '''0CoJUm6Qyw8W8jud''',
]

# 忽略以下 commit（通常是历史初始化提交）
commits = []

# ==== 自定义规则（补充 useDefault 的不足） ====

[[rules]]
id = "netease-cookie"
description = "网易云 Cookie 泄露检测"
regex = '''MUSIC_U=[A-Za-z0-9%]{30,}'''
tags = ["secret", "netease"]

[[rules]]
id = "spring-datasource-password"
description = "Spring Boot datasource password in properties/yaml"
regex = '''(?i)(spring\.datasource\.password\s*[=:]\s*)(.{8,})'''
tags = ["secret", "spring"]
[rules.allowlist]
  regexes = ['''^\s*#''', '''your_password''', '''changeme''']
