spring.application.name=wyy

# 🔐 Cloudflare Access 多租户权限与管理员邮箱配置（优先 CF_ADMIN_EMAILS，兼容 ADMIN_EMAILS）
app.security.admin-emails=${CF_ADMIN_EMAILS:${ADMIN_EMAILS:}}
app.security.mock-email=${CF_MOCK_USER_EMAIL:${MOCK_USER_EMAIL:}}

download.path=/media/music/
host.download.path=${HOST_DOWNLOAD_PATH:}
external.library.paths=${EXTERNAL_LIBRARY_PATHS:/media/external_music}
external.library.host.path=${EXTERNAL_LIBRARY_HOST_PATH:}
external.library.container.path=${EXTERNAL_LIBRARY_CONTAINER_PATH:/media/external}


spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
